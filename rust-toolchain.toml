# Pinned Rust toolchain for Phocommander.
#
# WHAT: the toolchain, its components and the cross-compilation targets that
#       every contributor and every CI job uses.
# WHY: a project that builds on macOS, Windows, Linux, BSD, Android and iPadOS
#      needs one defined compiler, otherwise a crate that builds for one
#      contributor breaks for the next one.
#
# `channel = "stable"` is used because the sandbox image ships stable 1.99.1
# and no 1.95 toolchain is installed. The minimum supported version stays
# pinned as `rust-version = "1.95"` in the workspace manifest, so every
# contributor is warned when a crate needs a newer compiler. Switch the channel
# to "1.95" once that toolchain is available in CI.
#
# The `targets` line installs the standard library for the three targets that
# are cross-compiled in CI (Android, iOS, FreeBSD). It was verified to work in
# the sandbox with `rustup target add`. Comment the line out if the CI image
# must not download additional target libraries.

[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "aarch64-apple-ios",
    "x86_64-unknown-freebsd",
]
