# The archive adapter of Phocommander.
#
# WHAT: the hardened resolution of the untrusted names an archive contains, the
#       limits of an extraction, the container adapters and the extraction
#       itself.
# WHY: an archive is untrusted input. A name like `../../etc/passwd` must
#       never reach the file system, and a name that is a reserved device on
#       Windows must never be written either. The container crates only parse
#       the container; every decision about *where* something is written is
#       made here, in this crate.
# EXAMPLE: `let path = phocommander_archive::resolve_entry_name("docs/readme.md")?;`

[package]
name = "phocommander-archive"
description = "Archive adapters and the hardened resolution of archive entry names."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The capability-based directory handle. Every access of the extraction
# happens relative to the opened destination directory, so that a symbolic
# link cannot redirect a write out of it (ADR-0004, decision 6).
# The access to the destination of the extraction happens relative to a
# descriptor of the directory, not over a path that is resolved a second time
# (ADR-0004, decision 6). The crate `rustix` offers that access without a
# single line of unsafe code, and it builds with the stable compiler — the
# crate `cap-std` would have needed a nightly one.
rustix = { workspace = true }
# The container formats of FR-67.
sevenz-rust2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
# The compression formats of a TAR container.
bzip2 = { workspace = true }
flate2 = { workspace = true }
lzma-rust2 = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
