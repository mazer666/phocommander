# The file operations of Phocommander.
#
# WHAT: the crate that will copy, move, rename and delete files.
# WHY: the operations run in the background, in a job queue, so that the
#       interface stays usable while they work. The crate is created in
#       milestone M0 so that the boundary between the operations and the
#       interface exists from the first day.
# EXAMPLE: the public API arrives in milestone M1.

[package]
name = "phocommander-ops"
description = "File operations and the job queue of Phocommander."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The error type of the crate derives its `Display` and its `Error` from
# `thiserror`, so that a failure of a job carries the path of the item and
# the code of the reason.
thiserror = { workspace = true }
# The search and the replacement of the multiple rename may be switched to
# regular expressions (FR-31).
regex = { workspace = true }

[dev-dependencies]
# The property test of the determinism of the rename rule (FR-33).
proptest = { workspace = true }

[lints]
workspace = true
