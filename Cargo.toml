# Phocommander — workspace root.
#
# WHAT: this file holds the shared package metadata and the pinned catalogue
#       of every external dependency of the project.
# WHY: a crate inherits its metadata and its dependency versions from here, so
#       a version is written exactly once and cannot drift between crates.
#       The dependency direction of the workspace is checked mechanically by
#       scripts/check-crate-boundaries.sh, not by convention.
# EXAMPLE: a member crate writes `egui = { workspace = true }` and inherits the
#          version 0.37 from the catalogue below.

[workspace]
resolver = "3"
members = [
    "crates/*",
    "platform/phocommander-platform",
    "apps/*",
    "tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mazer666/phocommander"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# User interface — egui/eframe generation 0.37 is the framework decision
# recorded in docs/REQUIREMENTS.md ("Benutzerschnittstelle und Plattformanpassung").
# ---------------------------------------------------------------------------
egui = "0.37"
eframe = "0.37"
egui_extras = "0.37"
egui_kittest = "0.37"
accesskit = "0.25"
winit = "0.30"
muda = "0.19"
rfd = "0.16"

# ---------------------------------------------------------------------------
# Serialisation and configuration.
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# ---------------------------------------------------------------------------
# Localisation.
#
# The catalogue format is Mozilla Fluent (section 8.2 of the specification).
# The `fluent` crate is the umbrella crate and re-exports `fluent-bundle`;
# `fluent-syntax` is used to read the identifiers of the messages out of a
# parsed catalogue, `rust-embed` embeds the `.ftl` files into the binary and
# `sys-locale` asks the operating system for the language of the user.
#
# `icu` carries the rules of the locales: the separator of the decimals, the
# order of the parts of a date and the cycle of the clock. The application
# therefore keeps no table of separators of its own, and the formats follow
# the locale of the system (FR-123). `writeable` writes the formatted value
# of `icu` into a string.
# ---------------------------------------------------------------------------
fluent = "0.17"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
rust-embed = { version = "8.13", features = ["debug-embed"] }
sys-locale = "0.3"
unic-langid = "0.9"
icu = "2.4"
writeable = "0.6"

# ---------------------------------------------------------------------------
# Error handling and diagnostics.
# ---------------------------------------------------------------------------
thiserror = "2"
anyhow = "1"
tracing = "0.1"
log = "0.4"

# ---------------------------------------------------------------------------
# Filesystem traversal.
# ---------------------------------------------------------------------------
walkdir = "2.5"
jwalk = "0.9"
notify = "8"
ignore = "0.4"
fs_extra = "1.3"

# ---------------------------------------------------------------------------
# Archive formats.
#
# `zip` MUST stay at 9.0.5 or newer. Older releases are affected by
# RUSTSEC-2025-0168 (broken path canonicalisation), RUSTSEC-2026-0367 (SUID/SGID
# bits survive extraction), RUSTSEC-2026-0368 (symlinks pointing outside the
# target directory) and RUSTSEC-2026-0369 (Unix permissions set through
# symlinks). The fix versions are: zip 9.0.5, tar 0.4.44, flate2 1.1.1.
# ---------------------------------------------------------------------------
zip = "9.0.5"
tar = "0.4"
flate2 = "1"
zstd = "0.14"
sevenz-rust2 = "0.24"
# The compression formats that a TAR container may use. `bzip2` is a pure
# Rust implementation, `lzma-rust2` decodes and encodes XZ without a system
# library. Both are needed for FR-67 ("TAR with GZip, BZip2, XZ and Zstd").
bzip2 = "0.6"
lzma-rust2 = "0.23"

# ---------------------------------------------------------------------------
# Viewer.
# ---------------------------------------------------------------------------
image = "0.25"
syntect = "5"
tree-sitter = "0.27"

# ---------------------------------------------------------------------------
# Test and benchmark tooling.
# ---------------------------------------------------------------------------
proptest = "1"
tempfile = "3"
insta = "1"
criterion = "0.8"

# ---------------------------------------------------------------------------
# Platform integration and capability-restricted file access.
# ---------------------------------------------------------------------------
cap-std = "4"
rustix = "1"
camino = "1"
dirs = "7"
opener = "0.9"
keyring = "4"

[workspace.lints.rust]
# `unsafe` is forbidden in first-party code. The few crates that need it are
# foreign, generated code and are not covered by this workspace.
unsafe_code = "deny"
# Missing documentation is a warning here; the core crates escalate it to an
# error as soon as they own a public API.
missing_docs = "warn"

[workspace.lints.clippy]
# No `unwrap()`, no `expect()`, no `todo!()`, no `unimplemented!()` on any path
# that a user can reach. The project rules forbid stubs.
#
# The two lints that forbid a panic are configured with `allow` in the test
# targets, because a test is allowed to fail loudly when its arrangement is
# wrong. The rule that matters is the one for the production code, and it is
# enforced there.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
