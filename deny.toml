# cargo-deny configuration for Phocommander.
#
# WHAT: the licence, advisory, duplicate-version and source rules that every
#       dependency of this project has to pass.
# WHY: Phocommander is distributed under "MIT OR Apache-2.0" and must stay
#      buildable and redistributable. The tool version is pinned because
#      cargo-deny interprets the very same file differently depending on its
#      version — a floating tool version turned a licence check into a false
#      alarm in the sibling project Vocument. Pinned version: cargo-deny
#      0.20.2, cargo-audit 0.22.2.
#
# The allow list contains NO GPL and NO AGPL on purpose. A copyleft dependency
# would pull the complete product — binary, sources and documentation — into a
# copyleft licence and would break the "MIT OR Apache-2.0" promise made to
# every user. The same argument rules out Slint in GPL mode and mupdf (AGPL).
# MPL-2.0 stays allowed because it is a weak, file-level copyleft: it obliges
# only the files that come from the dependency itself, not the combined work.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # The following four licences entered the tree with the archive adapters of
    # M1 — the compressors of the TAR container, the reader of the 7z
    # container and the font handling of the interface. All four are
    # permissive and none of them is a copyleft, so the policy of section 9.6
    # of the specification — copyleft is excluded, everything else that is
    # permissive is allowed — is applied to them as well:
    #   bzip2-1.0.6  the licence of the library `bzip2` (OSI approved)
    #   BSL-1.0       the Boost Software License 1.0 (OSI approved)
    #   CC0-1.0       the public-domain dedication of `ppmd-rust`
    #   MIT-0         MIT without the duty of naming the author
    # The licence of the font data of the interface is the combined
    # expression `(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0`: the
    # code is under MIT or Apache-2.0, the font data under the Open Font
    # License and under the licence of Ubuntu. The project ships no font of
    # its own — the fonts come from the system of the user.
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    # The licence of the font data of the interface is the combined
    # expression `(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0`: the
    # code is under MIT or Apache-2.0, the font data under the Open Font
    # License and under the licence of Ubuntu. The allow list of
    # cargo-deny 0.20.2 names one licence per entry, so the two parts of the
    # expression are named separately. The project ships no font of its own —
    # the fonts come from the system of the user.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
# Workspace members are published together with the project, so their licence
# does not have to be listed separately.
ignore = true

[advisories]
# A yanked release is a defect signal: it is usually pulled in by accident
# through a loose version requirement.
yanked = "deny"
# cargo-deny 0.20.2 has NO severity level for advisories. `unmaintained` is a
# SCOPE, not a lint level: it decides which unmaintained crates are reported
# at all ("all", "workspace", "transitive", "none"). A reported advisory is an
# ERROR unless its ID is listed under `ignore`. Writing `unmaintained = "warn"`
# therefore aborts the whole configuration with
#   error[unexpected-value]: expected '["all", "workspace", "transitive", "none"]'
# and `cargo deny check` exits before it has checked anything. That is exactly
# the failure the specification describes for the sibling project Vocument,
# where a licence check accused the configuration instead of the dependency.
#
# The intent — "an unmaintained crate must not fail the build, because a build
# on an unsupported platform may still need it" — is expressed as "none":
# unmaintained crates are not reported. If the team wants to see them without
# failing the gate, run `cargo deny check --warn advisories` in a separate,
# informational CI job instead of weakening this key.
unmaintained = "none"

[bans]
# Two versions of the same crate in one build are legal but increase the
# download size and the audit surface, so they are reported.
multiple-versions = "warn"
# A wildcard requirement ("*") makes a build unreproducible.
wildcards = "deny"
# A path dependency without a version key is reported by the wildcard check as
# a wildcard dependency too. Every crate of this workspace is referenced by
# path, so without this line the ban hits the workspace itself and the gate is
# red on every push. `allow-wildcard-paths` keeps the ban where it belongs: a
# "*" version requirement from crates.io is still denied, while a path
# dependency is allowed to be version-less. crates.io does not accept packages
# with path dependencies, so this exception cannot hide a wildcard from a
# published crate.
allow-wildcard-paths = true

[sources]
# Only the crates.io registry is a trusted source for this project. A git
# dependency or an unknown registry has to be reviewed explicitly before it
# may be allowed here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
