# Phocommander — Continuous Integration
#
# Diese Datei definiert die Abnahme-Gates aus docs/REQUIREMENTS.md.
# Kein Gate wird abgeschwaecht, um gruen zu werden: keine auskommentierten
# Lints, keine deaktivierten Tests, keine entfernten Pruefungen.
#
# Jeder Job laeuft unabhaengig. Ein rotes Gate blockiert den Meilenstein.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Alle Jobs abbrechen, wenn einer davon scheitert. Ein gruener Status entsteht
# nur, wenn JEDES Gate bestanden hat.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Die Werkzeugversionen sind gepinnt. cargo-deny liest dieselbe Konfiguration
  # je nach Version unterschiedlich - eine ungepinnte Version fuehrt zu einem
  # Fehlalarm, der die Konfiguration statt des Problems beschuldigt.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Formatierung, statische Analyse, Tests, Lizenzen, Schwachstellen.
  # Das ist das Gate, das bei JEDER Aenderung laeuft.
  # ---------------------------------------------------------------------------
  quality:
    name: Qualität (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatierung prüfen
        run: cargo fmt --all --check

      - name: Statische Analyse
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Crate-Grenzen prüfen
        run: ./scripts/check-crate-boundaries.sh

      - name: Dateigrößen prüfen
        run: ./scripts/check-file-size.sh

      - name: Telemetrie prüfen
        run: ./scripts/check-no-telemetry.sh

      - name: Anforderungskennzeichen prüfen
        run: python3 scripts/check-requirement-ids.py

      - name: Aktionskennzeichen prüfen
        run: python3 scripts/check-action-ids.py

      - name: Tastenbelegungen prüfen
        run: python3 scripts/check-keymap-consistency.py

      - name: Konfigurationsschema prüfen
        run: python3 scripts/check-config-schema.py

      - name: Oberflächenprofile prüfen
        run: python3 scripts/check-interface-profiles.py

      - name: Abnahmekriterien prüfen
        run: python3 scripts/check-acceptance-ids.py

      - name: Sprachkataloge prüfen
        run: python3 scripts/check-i18n-keys.py

      - name: Hartkodierte Texte prüfen
        run: python3 scripts/check-i18n-hardcoded.py

      - name: Links der Dokumentation prüfen
        run: python3 scripts/check-docs-links.py

      - name: Sprache der Dokumentation prüfen
        run: python3 scripts/check-docs-language.py

      - name: cargo-deny installieren
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: cargo-deny Version prüfen
        # Die Version wird verifiziert, weil unterschiedliche Versionen
        # unterschiedliche Allow-Listen-Syntaxen lesen.
        run: |
          installed=$(cargo deny --version | head -n 1 | awk '{print $3}')
          echo "installiert: $installed"
          test "$installed" = "$CARGO_DENY_VERSION"

      - name: Lizenz- und Advisory-Prüfung
        run: cargo deny check

      - name: cargo-audit installieren
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Schwachstellenprüfung
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Gate 2: Der Build laeuft auf jedem unterstuetzten Desktop-Betriebssystem.
  # Ein Fehler auf einer Plattform blockiert, auch wenn Linux gruen ist.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2

      # Die Spezifikation verlangt diese Gates in JEDEM Lauf, nicht nur im
      # Linux-Job. Deshalb laufen sie hier mit.
      - name: Formatierung prüfen
        run: cargo fmt --all --check

      - name: Statische Analyse
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release-Build
        run: cargo build --workspace --release

      - name: cargo-deny installieren
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: cargo-deny Version prüfen
        run: |
          installed=$(cargo deny --version | head -n 1 | awk '{print $3}')
          echo "installiert: $installed"
          test "$installed" = "$CARGO_DENY_VERSION"

      - name: Lizenz- und Advisory-Prüfung
        run: cargo deny check

      - name: cargo-audit installieren
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: cargo-audit Version prüfen
        run: |
          installed=$(cargo audit --version | head -n 1 | awk '{print $3}')
          echo "installiert: $installed"
          test "$installed" = "$CARGO_AUDIT_VERSION"

      - name: Schwachstellenprüfung
        run: cargo audit

      - name: Crate-Grenzen prüfen
        run: ./scripts/check-crate-boundaries.sh

      - name: Dateigrößen prüfen
        run: ./scripts/check-file-size.sh

  # ---------------------------------------------------------------------------
  # Gate 3: Quer-Kompilierung fuer die mobilen Ziele und die Linux-Bauten.
  # Der Bau wird geprueft, die Funktionstests bleiben eine manuelle Aufgabe
  # (NOT RUN mit Grund, bis echte Geraete im Testlauf stehen).
  #
  # Zwei Zeilen dieser Matrix sind noch nicht gebaut, und sie sagen es hier:
  #
  #   aarch64-linux-android   braucht das NDK von Google. Ohne das NDK
  #                           findet der C-Compiler des Crates `cc` keine
  #                           Werkzeuge fuer das Ziel, und der Bau bricht im
  #                           Schritt der C-Kompilierung ab. Das NDK liefert
  #                           der Meilenstein M4 mit dem Gradle-Projekt.
  #   aarch64-apple-ios*      braucht das SDK von Apple, das nur auf einem
  #                           macOS-Rechner mit Xcode vorhanden ist, und das
  #                           Programm, das gebaut wird, ist die
  #                           Desktop-Anwendung. Das Xcode-Projekt liefert
  #                           der Meilenstein M5.
  #
  # Beide Zeilen bleiben als Tor stehen, damit der rote Zustand sichtbar
  # bleibt, bis der jeweilige Meilenstein sie gruen macht.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Quer-Kompilierung (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            label: Android arm64
          - target: x86_64-unknown-linux-gnu
            label: Linux
          - target: aarch64-apple-ios
            label: iOS arm64
          - target: aarch64-apple-ios-sim
            label: iOS Simulator arm64
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Kein continue-on-error: die Spezifikation verlangt, dass ein rotes Gate
      # den Meilenstein blockiert. Der Quer-Bau ist eine Abnahmebedingung.
      - name: Bauen
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Ergebnis melden
        run: |
          echo "Quer-Bau ${{ matrix.target }} erfolgreich"
          echo "Die vollstaendige Abnahme der mobilen Ziele erfolgt in M4 und M5"

  # ---------------------------------------------------------------------------
  # Gate 3b: Die BSD-Bauten.
  #
  # Warum ein eigener Job: die beiden BSD-Ziele brauchen einen Cross-Linker
  # und den Sysroot des Zielsystems. Der Rust-Compiler allein baut sie nicht.
  # Die Linkzeile des Ziels x86_64-unknown-freebsd traegt die Bibliotheken
  # "-lexecinfo -lkvm -lmemstat -lprocstat -ldevstat", und der Linker des
  # Linux-Laeufer kennt sie nicht. Ohne das Kreuz-Werkzeug endet der Bau so:
  #
  #     error: linking with `cc` failed: exit status: 1
  #     /usr/bin/ld: cannot find -lexecinfo: No such file or directory
  #
  # Das Kreuz-Werkzeug kommt aus dem Container-Image von cross-rs. Das Image
  # traegt den Cross-Compiler, die crt-Objekte und den Sysroot des
  # Zielsystems und setzt die Variable CARGO_TARGET_..._LINKER, die der
  # Compiler fuer den Link-Schritt braucht. Die Version des Images ist
  # festgeschrieben, damit der Bau reproduzierbar bleibt.
  #
  # Die Quellen des Images:
  #   https://github.com/cross-rs/cross/blob/main/docker/Dockerfile.x86_64-unknown-freebsd
  #   https://github.com/cross-rs/cross/blob/main/docker/Dockerfile.x86_64-unknown-netbsd
  # ---------------------------------------------------------------------------
  bsd:
    name: BSD (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            label: FreeBSD
            image: ghcr.io/cross-rs/x86_64-unknown-freebsd:0.2.5
            # Die Laufzeitbibliothek des Systems steht in der Linkzeile der
            # fertigen Datei. Sie beweist, dass ein BSD-Programm entstanden ist
            # und kein Linux-Programm.
            libc: libc.so.7
          - target: x86_64-unknown-netbsd
            label: NetBSD
            image: ghcr.io/cross-rs/x86_64-unknown-netbsd:0.2.5
            libc: libc.so.12
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Der Bau laeuft im Container, weil das Kreuz-Werkzeug dort liegt. Das
      # Werkzeug des Rust-Projekts kommt aus dem Laufzeitsystem des
      # Laeufer: das Verzeichnis mit dem Rust-Werkzeug und das Verzeichnis
      # mit der Toolchain werden eingebunden, und die Variable
      # RUSTUP_TOOLCHAIN benennt die Toolchain aus, damit die Datei
      # rust-toolchain.toml nicht im Container gelesen wird.
      #
      # Die Verzeichnisse haengen an /cargo und /rustup und nicht an /root:
      # der Container laeuft mit der Kennung des Laeufer, und ein Benutzer
      # ohne Rechte darf /root nicht betreten.
      - name: Bauen
        run: |
          docker run --rm \
            --volume "$PWD:/project" \
            --workdir /project \
            --volume "$HOME/.cargo:/cargo" \
            --volume "$HOME/.rustup:/rustup" \
            --env CARGO_HOME=/cargo \
            --env RUSTUP_HOME=/rustup \
            --env RUSTUP_TOOLCHAIN=stable-x86_64-unknown-linux-gnu \
            --user "$(id -u):$(id -g)" \
            "${{ matrix.image }}" \
            /cargo/bin/cargo build --workspace --release --target "${{ matrix.target }}"

      # Der Beweis, dass der Bau etwas erzeugt hat: die Datei ist eine
      # ELF-Datei des Zielsystems und haengt an der Laufzeitbibliothek des
      # Zielsystems. Ein Linux-Programm haengt an "libc.so.6", und die
      # Pruefung schlaegt dann fehl.
      - name: Artefakt pruefen
        run: |
          artefact="target/${{ matrix.target }}/release/phocommander-desktop"
          test -f "$artefact"
          file "$artefact"
          readelf -d "$artefact" | grep NEEDED || true
          if ! readelf -d "$artefact" | grep -q "NEEDED.*${{ matrix.libc }}"; then
            echo "FEHLER: die Datei haengt nicht an ${{ matrix.libc }}." >&2
            exit 1
          fi
          if readelf -d "$artefact" | grep -q "libc.so.6"; then
            echo "FEHLER: die Datei ist ein Linux-Programm." >&2
            exit 1
          fi

      - name: Ergebnis melden
        run: |
          echo "BSD-Bau ${{ matrix.target }} erfolgreich"
          echo "Der Bau auf einem echten BSD-Geraet bleibt eine manuelle Aufgabe (M3)"

  # ---------------------------------------------------------------------------
  # Gate 4: Das Leistungsgate. Die Zielwerte aus der Spezifikation sind
  # Schwellen, keine Wünsche. Der Job misst und vergleicht.
  # ---------------------------------------------------------------------------
  performance:
    name: Leistung
    runs-on: ubuntu-latest
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2

      - name: Messungen
        run: cargo bench --workspace -- --output-format bencher

      - name: Ergebnisse ausgeben
        run: |
          echo "Die Zielwerte der Spezifikation stehen in docs/REQUIREMENTS.md"
          echo "Ein Zielwert, der nicht gemessen wurde, gilt als nicht erfuellt"

  # ---------------------------------------------------------------------------
  # Gate 5: Jede Nacht laeuft der Fuzzer laenger und die Tests ohne Cache.
  # ---------------------------------------------------------------------------
  nightly:
    name: Nachtlauf (Fuzzing)
    runs-on: ubuntu-latest
    schedule:
      - cron: "17 3 * * *"
    continue-on-error: true
    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2

      - name: Fuzzing
        run: |
          cargo +nightly fuzz run -- -max_total_time=600

      - name: Tests ohne Cache
        run: cargo test --workspace --all-features
