# The properties of the Gradle project of the Android application.
#
# WHY: the heap of the build is larger than the default, because the
#       Kotlin compiler of the Compose needs more memory than a small
#       application. The build runs in the container of the CI as well,
#       and the container has three gigabytes of memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
