# The desktop application of Phocommander.
#
# WHAT: the entry point of the macOS, the Windows, the Linux and the BSD
#       build.
# WHY: milestone M0 builds the workspace, the crate boundaries and the gates.
#       The window arrives in milestone M1, so the program reports what
#       exists today instead of pretending to be a file manager.
# EXAMPLE: `cargo run -p phocommander-desktop`

[package]
name = "phocommander-desktop"
description = "The desktop application of Phocommander for macOS, Windows, Linux and BSD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The library of the desktop build. It carries the translation of the
# configuration into the rules of the subsystems, so that the documentation
# examples of that translation are compiled and run with the test suite.
name = "phocommander_desktop"
path = "src/lib.rs"

[dependencies]
# The application is the composition root of the workspace: it is the only
# crate that may see the core crate, the configuration crate, the operations
# crate and the viewer crate at the same time, because no crate below
# `crates/` may depend on a sibling. The integration test that holds the
# canonical limits and the shipped configuration file against each other
# therefore lives here as well.
# The window itself. The interface crate draws with egui, and the framework
# of egui owns the window of the application.
eframe = { workspace = true }
egui = { workspace = true }

phocommander-config = { path = "../../crates/phocommander-config" }
phocommander-core = { path = "../../crates/phocommander-core" }
phocommander-i18n = { path = "../../crates/phocommander-i18n" }
phocommander-ops = { path = "../../crates/phocommander-ops" }
phocommander-platform = { path = "../../platform/phocommander-platform" }
phocommander-ui = { path = "../../crates/phocommander-ui" }
phocommander-viewer = { path = "../../crates/phocommander-viewer" }

[lints]
workspace = true
