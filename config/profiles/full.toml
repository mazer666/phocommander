# Phocommander — interface profile "full" (shipped).
#
# WHAT: this file is the built-in profile `full`. It is the interface with
#       every area and every command: the two panels, the menu bar, the
#       toolbar, the directory tree, the quick view, the job list and the
#       status bar.
# WHY: a user who arrives from a desktop file manager expects the furniture.
#       The profile gives it to them without making it the price of the
#       entry — the choice between the two profiles is a visible setting with
#       a one-line description, not a paywall (requirement FR-141).
# EXAMPLE: copy this file to the configuration directory under the name
#          `full.toml` and select it in the settings, or edit the copy to
#          hide a single command further.
#
# The file format is TOML. A profile is a plain file in the configuration
# directory; it contains interface decisions only — no paths, no history, no
# credentials (requirement FR-145).
#
# Location of the active profile directory:
#   macOS:      ~/Library/Application Support/Phocommander/profiles/
#   Windows:    %APPDATA%\Phocommander\profiles\
#   Linux/BSD:  $XDG_CONFIG_HOME/phocommander/profiles/
#   Android:    app sandbox
#   iPadOS:     app sandbox

# The name of the profile. It is the identifier under which the profile is
# selected in the settings and under which it is exported.
name = "full"

# One line that says what this profile changes. The setting that selects the
# profile shows this text, so the user sees the consequence before choosing.
description = "Every panel area and every command, including the menu bar and the toolbar."

# Which areas of the interface exist in this profile.
[panels]
# The toolbar with the icon buttons. It is switched on, so that every command
# is reachable with the pointer as well.
show_toolbar = true
# The directory tree beside a panel. The tree is switched on for both panels.
show_directory_tree = true
# The quick view, the third area that previews the marked file.
show_quick_view = true
# The list of the running operations. The list is switched on in addition to
# the job cue in the status bar, so that several operations can be watched at
# the same time.
show_job_list = true
# The status bar of the active panel. It carries the job cue: the state, the
# progress, the rate and the current item of a running operation
# (specification, section 6.10).
show_status_bar = true
# The menu bar. On macOS it is the native menu of the operating system, on
# Windows the menu of the window, on Linux and BSD the menu of the window
# through GTK.
show_menu_bar = true
# The command line at the lower edge of a panel. It belongs to the frame of a
# panel and is therefore always present.
show_command_line = true

# How the commands are presented.
[commands]
# "visible" means: every command is written where it belongs — in the menu
# bar, in the toolbar or in the context menu of a panel. "palette" means: the
# commands are not written on the surface, they stay reachable through the
# action palette. "hidden" removes a command from every menu and from the
# palette.
#
# This profile uses "visible": it is the variant for the user who expects the
# furniture and wants to see every command where it belongs.
visibility = "visible"

# Per-command overrides of this profile.
[display]
# The commands that are hidden in this profile. A command that is visible by
# default can be hidden here, and a command that is hidden by default can be
# made visible.
#
# The list is empty: this profile shows every command. The single commands
# that a user wants out of the way are named here one by one.
hidden = []
